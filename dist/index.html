<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#164f54">
  <meta name="description" content="Çaylar hazır! Simit, çay, peynir ve üzümleri eşleştir; Boğaz kıyısındaki kahvaltı sepetlerini tamamla.">
  <title>Çay & Simit — Bir Boğaz molası</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23164f54'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%23d78937' stroke='%23ffe2a6' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23164f54'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="powerups.css?v=4">
  <link rel="stylesheet" href="mobile.css?v=5">
  <script src="engine.js?v=3" defer></script>
  <script src="effects.js?v=3" defer></script>
  <script src="game.js?v=3" defer></script>
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-.6 2.4-2 .9-2.2-.7-2 3.4 1.7 1.7v2.6L2.2 15l2 3.4 2.2-.7 2 .9L9 21h4l.6-2.4 2-.9 2.2.7 2-3.4-1.7-1.7v-2.6L19.8 9l-2-3.4-2.2.7-2-.9L13 3z"/><circle cx="11" cy="12" r="3"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 4 5 9H2v6h3l6 5zm4 4c3 2 3 6 0 8m3-11c5 4 5 10 0 14"/></symbol>
      <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1.5 1-1.5 1.5-1.5 2.5m0 3v.2"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c1.6 0 3-1.5 4-3m4-6c1-1.5 2.4-3 4-3h3m-4-4 4 4-4 4"/></symbol>
      <symbol id="i-hammer" viewBox="0 0 40 40"><path d="m15 18-8 16c-1 3 3 5 5 2l10-15" fill="#bd7840" stroke="#754b2c" stroke-width="2"/><path d="m12 8 5-5 19 11-5 8z" fill="#f8d884" stroke="#af7933" stroke-width="2"/><path d="m13 8 18 11" fill="none" stroke="#fff1bb" stroke-width="3"/></symbol>
      <symbol id="i-rocket" viewBox="0 0 40 40"><path d="m10 27-5 8 10-3" fill="#ffc749"/><path d="M12 27C8 12 24 3 34 5c2 12-7 27-21 24" fill="#f36845" stroke="#923c2f" stroke-width="2"/><path d="m13 20 10 9" stroke="#ffdf89" stroke-width="5"/><circle cx="26" cy="13" r="4" fill="#c4eeec" stroke="#fff1cf" stroke-width="2"/><path d="m10 18-7 6 8 2m10 4 1 7 7-10" fill="#258e98"/></symbol>
      <symbol id="i-star" viewBox="0 0 32 32"><path d="m16 2 4.4 8.9 9.8 1.4-7.1 6.9 1.7 9.8-8.8-4.6-8.8 4.6 1.7-9.8-7.1-6.9 9.8-1.4z"/></symbol>
      <symbol id="i-bomb" viewBox="0 0 40 40"><path d="M24 12c-2-8 10-8 10-3" fill="none" stroke="#795e37" stroke-width="3"/><path d="m22 10 5 2-3 7-5-2z" fill="#b38745"/><circle cx="19" cy="25" r="12" fill="#7355a0" stroke="#47366a" stroke-width="2"/><path d="M11 23a8 8 0 0 1 8-6" fill="none" stroke="#cfb9e6" stroke-width="3"/><path d="m34 3 1 4 4 1-4 2-1 4-1-4-4-2 4-1z" fill="#ffd05c"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    </defs>
  </svg>
  <main class="app">
    <header class="topbar">
      <button class="brand" id="brandButton" aria-label="Çay ve Simit, bölüm haritasını aç"><span class="brand-simit" aria-hidden="true"></span><span>çay <em>&</em> simit<small>BİR BOĞAZ MOLASI</small></span></button>
      <div class="top-actions"><div class="coin-pill" title="Bölümlerden kazandığın altın"><span class="coin">₺</span><span id="coins">0</span></div><button class="icon-button" id="settingsButton" aria-label="Ayarlar"><svg><use href="#i-settings"/></svg></button></div>
    </header>
    <div class="game-shell">
      <section class="garden" aria-label="Boğaz kıyısında çay bahçesi">
        <img class="garden-art" src="assets/tea-garden.png" alt="Çay tepsisi taşıyan güler yüzlü bir kahveci ve Boğaz manzaralı çay bahçesi" fetchpriority="high">
        <div class="garden-shade"></div>
        <div class="location"><svg><use href="#i-pin"/></svg> İSTANBUL · BOĞAZ KIYISI</div>
        <div class="garden-title"><span>Demli bir çay.</span><span>Tatlı bir mola.</span></div>
        <div class="host-note"><span class="note-spark">✦</span><p id="hostText">Çaylar benden,<br><strong>eşleştirmeler senden!</strong></p><span class="host-signature">— Kemal Usta</span></div>
        <button class="journey-button" id="mapButton"><span class="journey-icon"><svg><use href="#i-pin"/></svg></span><span><small>MAHALLE MAHALLE</small>Boğaz yolculuğu</span><svg class="arrow"><use href="#i-arrow"/></svg></button>
      </section>
      <section class="play-area" aria-label="Eşleştirme oyunu">
        <div class="level-heading"><span class="heading-line"></span><span id="levelTitle">BÖLÜM 1 · İLK DEM</span><span class="heading-line"></span></div>
        <div class="game-hud">
          <div class="moves-card"><span>HAMLE</span><strong id="moves">26</strong><i></i></div>
          <div class="targets-card"><span class="targets-label">KAHVALTIYI HAZIRLA</span><div class="targets" id="targets"></div></div>
        </div>
        <div class="score-track"><div class="score-caption"><span id="score">0</span><small>PUAN</small></div><div class="progress-rail"><div id="scoreFill"></div><svg class="progress-star" data-star="0"><use href="#i-star"/></svg><svg class="progress-star" data-star="1"><use href="#i-star"/></svg><svg class="progress-star" data-star="2"><use href="#i-star"/></svg></div></div>
        <div class="board-space"><div class="board-frame"><div class="board" id="board" role="group" aria-label="7 sütun ve 8 satırlı oyun tahtası"></div><div class="effects" id="effects" aria-hidden="true"><canvas id="fxCanvas"></canvas></div><div class="combo-label" id="combo" aria-hidden="true"></div></div></div>
        <div class="game-guidance" id="guidance" aria-live="polite"><span class="guidance-dot"></span> Yan yana taşları değiştir, 3 tanesini eşleştir.</div>
        <div class="boosters">
          <button class="booster" id="hammerButton" data-booster="hammer" aria-label="Tokmak: bir taşı veya sepeti kır"><span class="booster-icon honey"><svg><use href="#i-hammer"/></svg><b id="hammerCount">3</b></span><span>Tokmak</span></button>
          <button class="booster" id="rocketButton" data-booster="rocket" aria-label="Roket: seçtiğin satırı temizle"><span class="booster-icon coral"><svg><use href="#i-rocket"/></svg><b id="rocketCount">2</b></span><span>Roket</span></button>
          <button class="booster" id="shuffleButton" data-booster="shuffle" aria-label="Taşları karıştır"><span class="booster-icon mint"><svg class="stroke-icon"><use href="#i-shuffle"/></svg><b id="shuffleCount">2</b></span><span>Karıştır</span></button>
          <div class="booster-divider"></div><button class="help-button" id="helpButton" aria-label="Nasıl oynanır"><svg><use href="#i-help"/></svg></button>
        </div>
      </section>
    </div>
    <footer class="page-footer"><span>ACELESİ YOK. KEYFİ ÇOK.</span><span class="footer-flower">✦</span><span>HER EŞLEŞMEDE BİRAZ İSTANBUL.</span></footer>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="modal" aria-labelledby="modalTitle"><button class="modal-close icon-button" id="closeModal" aria-label="Kapat"><svg><use href="#i-close"/></svg></button><div id="modalContent"></div></dialog>
  <noscript>Bu oyunu oynamak için tarayıcında JavaScript'i etkinleştir.</noscript>
</body>
</html>
