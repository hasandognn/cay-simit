name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out game source
        uses: actions/checkout@v6
      - name: Verify gameplay and animation timing
        run: node --test tests/*.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload standalone game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
